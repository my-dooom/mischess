name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    name: Build (Windows)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MinGW to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Stockfish is built from source with its own Makefile, which needs
      # MSYS2's GNU make and shell (mingw32-make cannot run it)
      - name: Install GNU make (MSYS2) for the Stockfish build
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed make"

      # x86-64-avx2 rather than native so the packaged engine runs on any
      # CPU from the last decade, not just the runner's
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles" -DMISCHESS_STOCKFISH_ARCH=x86-64-avx2

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mischess-Windows
          path: build/mischess-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/**
